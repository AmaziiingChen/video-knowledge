<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KnowledgeHub 设置界面审阅</title><link rel="stylesheet" href="settings-review.css"></head>
<body><main class="dialog"><header><h1>设置</h1><button aria-label="关闭">×</button></header><div class="layout"><nav><button>外观</button><button class="active">处理与 AI</button><button>知识库</button><button>内容连接</button><button>微信公众号</button><button>凭证与访问</button></nav><section class="content"><h2>处理与 AI</h2><div class="group"><b>语音识别</b><article><div><h3>识别后端</h3><p>自动模式会在可用后端中选择适合当前设备的实现。</p></div><select><option>自动</option><option>MLX</option><option>Faster-Whisper</option></select></article><article><div><h3>模型策略</h3><p>智能模式会按视频时长选择模型。</p></div><select><option>智能</option><option>手动</option></select></article></div><div class="group"><b>AI 总结与追问</b><article><div><h3>DeepSeek API Key</h3><p>用于文章总结和追问，仅保存在本机。</p></div><div class="stack"><input type="password" placeholder="sk-..."><input value="https://api.deepseek.com"><button class="primary">保存</button></div></article><article><div><h3>默认模型</h3><p>用于内容总结和当前内容的追问。</p></div><select><option>V4 Flash</option><option>V4 Pro</option></select></article></div><div class="wechat"><h2>微信公众号</h2><div class="group"><b>日报与周报</b><p>按分组手动汇总已入库的公众号文章，并保存到文件树和 Obsidian。</p><div class="row"><input placeholder="新分组，例如：学术动态"><button class="primary">添加分组</button></div><article><div><h3>学术动态</h3><p>3 个公众号</p></div><div><button>生成今日日报</button><button>生成本周周报</button></div></article></div><div class="group"><b>已订阅公众号</b><article><div><h3>示例公众号</h3><p>每 6 小时 · 新文章自动分析</p></div><div class="stack"><select><option>学术动态</option><option>政策通知</option><option>未分组</option></select><button>检查最新</button><button>回溯历史</button></div></article></div></div></section></div></main></body></html>
