name: Verify

on:
  push:
  pull_request:

jobs:
  public-release-tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python scripts/check_public_release_tree.py
      - run: python scripts/check_architecture_budget.py

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install pip-audit pytest
      - run: pip-audit -r requirements.txt
      - run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --package-lock-only --audit-level=high
      - run: npm test
      - run: npm run check:reachability
      - run: npm run build
      - run: npm run build:public-report

  desktop-shell:
    runs-on: macos-latest
    env:
      TZ: UTC
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check:reachability
      - run: npm run build
