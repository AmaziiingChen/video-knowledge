name: Release unsigned DMG

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package-macos-arm64:
    runs-on: macos-15
    env:
      TZ: UTC
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Resolve release version
        id: release
        shell: bash
        run: |
          VERSION=$(node -p "require('./frontend/package.json').version")
          if [[ "$GITHUB_REF" == refs/tags/v* && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $VERSION" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - run: python scripts/check_public_release_tree.py
      - run: python scripts/check_architecture_budget.py
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt pip-audit pytest ruff
      - run: pip-audit -r requirements.txt
      - run: ruff check --select E9,F63,F7,F82 backend tests scripts
      - run: python -m pytest
      - run: npm ci
        working-directory: frontend
      - run: npm audit --package-lock-only --audit-level=high
        working-directory: frontend
      - run: npm run lint
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend
      - run: npm run check:reachability
        working-directory: frontend
      - run: npm run build:public-report
        working-directory: frontend
      - run: npm run desktop:package:mac
        working-directory: frontend
      - name: Validate DMG and write checksum
        run: >-
          python scripts/validate_macos_release.py
          --dmg frontend/release/KnowledgeHub-${{ steps.release.outputs.version }}-arm64.dmg
          --expected-version ${{ steps.release.outputs.version }}

      - uses: actions/upload-artifact@v7
        if: github.event_name == 'workflow_dispatch'
        with:
          name: KnowledgeHub-${{ steps.release.outputs.version }}-macos-arm64-unsigned
          path: |
            frontend/release/KnowledgeHub-${{ steps.release.outputs.version }}-arm64.dmg
            frontend/release/KnowledgeHub-${{ steps.release.outputs.version }}-arm64.dmg.sha256
          compression-level: 0
          if-no-files-found: error
          retention-days: 2

      - name: Create normal GitHub Release when needed
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "KnowledgeHub $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            "frontend/release/KnowledgeHub-${{ steps.release.outputs.version }}-arm64.dmg" \
            "frontend/release/KnowledgeHub-${{ steps.release.outputs.version }}-arm64.dmg.sha256" \
            --clobber
